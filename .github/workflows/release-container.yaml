---
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

name: release

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: GoogleCloudPlatform/release-please-action@v5.0.0
        name: release
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: simple
          package-name: ${{ github.repository }}

      - name: Checkout
        uses: actions/checkout@v7.0.1
        if: ${{ steps.release.outputs.release_created }}

      - name: Log in to the container registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        if: ${{ steps.release.outputs.release_created }}

      - name: Extract metadata for container
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=v${{steps.release.outputs.major }}.${{steps.release.outputs.minor }}.${{steps.release.outputs.patch }}
        if: ${{ steps.release.outputs.release_created }}

      - name: Build and push container image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
        if: ${{ steps.release.outputs.release_created }}

  # Releases created with GITHUB_TOKEN do not trigger other workflows, so the
  # binaries are built and published here. sc trusts the keyless signature of
  # this workflow file on main, see selfupdate.DefaultVerifiers, so do not
  # rename it or move these jobs elsewhere.
  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: cross-build-linux
          # the darwin binary needs cgo, so it is built natively on Apple silicon
          - runner: macos-latest
            target: build-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: Build binaries
        run: make "$TARGET" VERSION="$TAG"
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: binaries-${{ matrix.target }}
          path: builds/sc-*
          if-no-files-found: error

  publish:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # requests the OIDC token for keyless signing
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: binaries-*
          path: builds
          merge-multiple: true

      - name: Create checksums
        run: make checksums VERSION="$TAG"
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}

      - uses: sigstore/cosign-installer@v4.1.2

      # signify needs the private key, which is kept off CI
      - name: Sign checksums
        run: make sign SIGNERS=cosign

      - name: Upload release assets
        run: gh release upload "$TAG" builds/sc-* builds/checksum.sha256 builds/checksum.sha256.sigstore.json --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
